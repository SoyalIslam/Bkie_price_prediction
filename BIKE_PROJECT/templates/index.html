<body>
    <h2>Old Bike Price Prediction Project</h2>
<p>This is my bike price prediction project where you can get prediction of old bike.</p>
<form action="{{ url_for('prediction') }}" method="post">
    <label for="">Brand Name:  </label>
    <select name="brand" id="">
            <option value="3" >Royal Enfield</option>
            <option value="8">KTM</option>
            <option value="1">Bajaj</option>
            <option value="9">Harley-Davidson</option>
            <option value="4">Yamaha</option>
            <option value="5">Honda</option>
            <option value="6">Suzuki</option>
            <option value="7">TVS</option>
            <option value="10">Kawasaki</option>
            <option value="11">Hyosung</option>
            <option value="12">Benelli</option>
            <option value="13">Mahindra</option>
            <option value="14">Triumph</option>
            <option value="15">Ducati</option>
            <option value="16">BMW</option>
    </select>
        <br><br>
<label for="">Ownership:    </label>
    <select name="owner" id="">
        <option value="1">First owner</option>
        <option value="2">Second owner</option>
        <option value="3">Third owner</option>
        <option value="4">Fourth owner</option>

    </select><br><br>
<label for="">Kms_driven:</label>
<input type="text" name="Kms_driven"><br><br>
<label for="">power:</label>
<input type="text" name="power"><br><br>
<label for="">Age:</label>
<input type="text" name="age"><br><br>

<button type="submit">SUBMIT</button>
</form>







</body>
</html>
